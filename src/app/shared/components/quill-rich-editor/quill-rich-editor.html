<div style="padding: 20px; max-width: 800px; margin: auto">
  <h2>ngx-quill with Image Resize</h2>

  @if (isReady) {
    <quill-editor
      [(ngModel)]="editorContent"
      [modules]="quillModules"
      (onEditorCreated)="addTooltips($event)"
      [style]="{ height: '350px', width: '100% ' }"
    >
    </quill-editor>
  }

  <hr style="margin: 30px 0" />

  <!-- Raw HTML Code to store in Database-->
  <h3>Saved Raw HTML:</h3>
  <div style="background-color: #f4f4f4; padding: 10px; border-radius: 4px">
    <code>{{ editorContent }}</code>
  </div>

  <hr style="margin: 30px 0" />

  <!-- Output Preview -->
  <h3>Rendered Result:</h3>
  <div
    [innerHTML]="editorContent | safeHtml"
    style="border: 1px solid #ccc; padding: 10px"
    class="result-div"
  ></div>
</div>
